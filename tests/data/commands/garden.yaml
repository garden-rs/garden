commands:
  pwd: pwd
  echo: echo "$@"
  echo-name: echo ${name}
  shell-quoted-variables: |
    test1=abc
    test2=xyz
    echo $test1/$test2
  # Ensure that a scriptlet provided by a ${var} reference retains $plain_shell_vars.
  shell-quoted-scriptlet: |
    ${scriptlet-variables}
    echo $test1/$test2

variables:
  name: default-name
  test: test
  scriptlet-variables: |
    test1=abc
    test2=xyz
